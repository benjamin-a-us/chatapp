; PHP-FPM pool configuration for Chat House
; Production-optimized settings

[chat]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 1000
pm.max_requests_grace_period = 30s
pm.process_idle_timeout = 10s

; Timeouts
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm/chat-slow.log

; Error handling
catch_workers_output = yes
php_flag[display_errors] = off
php_flag[log_errors] = on
php_value[error_log] = /var/log/php-fpm/chat-error.log
php_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance
php_value[memory_limit] = 256M
php_value[max_execution_time] = 60
php_value[upload_max_filesize] = 100M
php_value[post_max_size] = 100M
php_value[max_input_vars] = 10000

; Extensions
php_admin_value[extension] = pdo_sqlite.so
php_admin_value[extension] = pdo_mysql.so
php_admin_value[extension] = curl.so
php_admin_value[extension] = mbstring.so
php_admin_value[extension] = xml.so
php_admin_value[extension] = zip.so
php_admin_value[extension] = bcmath.so

; Additional security and performance
php_value[session.gc_maxlifetime] = 86400
php_value[default_socket_timeout] = 60
php_value[realpath_cache_size] = 4096K
php_value[realpath_cache_ttl] = 600
