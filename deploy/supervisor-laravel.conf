# Supervisor configuration for Laravel queue worker
# Handles background jobs (emails, notifications, etc)

[program:chat-laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chat/backend/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=3600
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chat-laravel-worker.log
stdout_logfile_maxbytes=10M
stdout_logfile_backups=3
environment=LARAVEL_TINKER_SHELL="/bin/bash"
user=www-data

# Restart every hour to clear memory leaks
stopasgroup=true
priority=999
