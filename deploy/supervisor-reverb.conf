# Supervisor configuration for Laravel Reverb WebSocket server
# Handles real-time messaging, typing indicators, and presence

[program:chat-reverb]
process_name=%(program_name)s
command=php /var/www/chat/backend/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chat-reverb.log
stdout_logfile_maxbytes=10M
stdout_logfile_backups=5
numprocs=1
user=www-data

# Environment variables
environment=LARAVEL_ENV="production"

# Restart every 2 hours
stopasgroup=true
priority=998
