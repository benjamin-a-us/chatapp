[supervisord]
nodaemon=true


[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true


[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true


[program:reverb]
command=php /var/www/html/artisan reverb:start
directory=/var/www/html
user=www-data
autostart=true
autorestart=true


[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3
directory=/var/www/html
user=www-data
autostart=true
autorestart=true